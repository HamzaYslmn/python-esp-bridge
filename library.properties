author=Hamza Yesilmen <resmiyslmn@gmail.com>
maintainer=Hamza Yesilmen <resmiyslmn@gmail.com>
sentence=Flash-once ESP32 firmware that exposes every peripheral to Python over USB serial or Bluetooth.
paragraph=Turns an ESP32 into a live bridge — GPIO, ADC/DAC, PWM, touch, I2C, SPI, UART, Wi-Fi sockets, BLE, ESP-NOW, RMT, 1-Wire, CAN, I2S, filesystem, NVS and OTA are all driven from the host with the python-esp-bridge package (pip install python-esp-bridge). One EspBridge.begin() call starts a FreeRTOS task model (separate TX, RX and network tasks) so blocking radio I/O never stalls peripheral traffic. Requires arduino-esp32 core 3.x.
category=Communication
