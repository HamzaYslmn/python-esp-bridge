[project]
name = "python-esp-bridge"
version = "0.0.1"
description = "Control every ESP32 peripheral from Python over USB serial — GPIO, ADC, DAC, PWM, touch, I2C, SPI, UART, Wi-Fi sockets, BLE"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HamzaYslmn" }]
keywords = ["esp32", "raspberry-pi", "gpio", "serial", "bridge", "firmata", "i2c", "spi", "ble"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
oled = ["pillow>=10"]  # espbridge.oled: PIL drawing for SSD1306/SH1106 displays

[project.urls]
Homepage = "https://github.com/HamzaYslmn/python-esp-bridge"

[project.scripts]
espbridge = "espbridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=10", "gpiozero>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["espbridge"]
